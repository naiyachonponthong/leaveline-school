<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>เข้าสู่ระบบลาออนไลน์</title>
  <style>
    :root{color-scheme:light;--paper:oklch(97% .012 265);--ink:oklch(28% .035 265);--muted:oklch(49% .03 265);--brand:oklch(45% .13 265);--line:oklch(88% .02 265)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;line-height:1.7;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,580px);padding:clamp(28px,6vw,56px);background:white;border:1px solid var(--line);border-radius:20px}
    .eyebrow{margin:0 0 16px;color:var(--muted);font-size:14px}h1{font-size:clamp(26px,6vw,34px);line-height:1.4;margin:0 0 20px;font-weight:700}
    p{margin:0 0 24px;color:var(--muted)}.enter{display:block;border-radius:10px;padding:14px 20px;background:var(--brand);color:white;text-align:center;text-decoration:none;font-weight:bold;min-height:52px}
    .enter:hover{background:oklch(38% .12 265)}a:focus-visible{outline:3px solid oklch(72% .13 85);outline-offset:5px}.note{font-size:14px;margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">บริการสำหรับครูและบุคลากร</p>
    <h1 id="title">เข้าสู่ระบบลาออนไลน์</h1>
    <p>ยื่นคำขอ ตรวจสอบวันลาคงเหลือ และติดตามผลการพิจารณาได้ในระบบของโรงเรียน</p>
    <a id="enter" class="enter" href="https://script.google.com/macros/s/AKfycbw-Dz-7LKc0fMXIMZXzC7RyHmlGAbofVDOVf4c5Jbn0aYNNmN4av9HomtJdna5Yd-lBEA/exec?page=liff" target="_top" rel="noreferrer">เปิดระบบลาออนไลน์</a>
    <p class="note">หากระบบขอให้เข้าสู่ LINE ให้ใช้บัญชีที่ผูกกับโรงเรียน หากเข้าใช้งานไม่ได้ กรุณาติดต่องานบุคลากร</p>
  </main>
  <script>
    (function(){
      'use strict';
      var link=document.getElementById('enter'),target=new URL(link.href),incoming=new URL(window.location.href).searchParams;
      // Forward only public request context; never carry tokens or arbitrary destinations.
      var request=incoming.get('request');
      if(request&&/^[A-Za-z0-9_-]{1,128}$/.test(request))target.searchParams.set('request',request);
      if(incoming.get('mode')==='approval')target.searchParams.set('mode','approval');
      link.href=target.href;
    })();
  </script>
</body>
</html>
